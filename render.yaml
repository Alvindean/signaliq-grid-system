services:
  - type: web
    name: signaliq-grid-system
    env: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/health
    disk:
      name: signaliq-data
      mountPath: /app/server/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: thealvindean@gmail.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      - key: RESEND_WEBHOOK_KEY
        sync: false
      - key: CRM_WEBHOOK_KEY
        sync: false
      - key: CAMPAIGN_REPLY_TO
        value: thealvindean@gmail.com
      - key: SENDING_FROM
        value: SignalIQ <onboarding@resend.dev>
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
